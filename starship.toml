# version: 1.0.0
palette = "catppuccin_mocha"
add_newline = false
continuation_prompt = "[▸▹ ](dimmed white)"

format = """($nix_shell$container$fill$git_metrics\n)\
$username\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$character"""

right_format = """
$cmd_duration\
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$time"""
[fill]
symbol = ' '

[username]
style_user = "overlay0 italic"
style_root = "purple italic"
format = "[ $user ]($style)[@ ](surface2)"
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "[ ](bold blue)[$hostname](blue) "

[localip]
ssh_only = true
format = " ◯[$localipv4](bold magenta)"
disabled = true 

[character]
format = "$symbol "
success_symbol = "[◎](bold italic bright-yellow)"
error_symbol = "[○](italic purple)"
vimcmd_symbol = "[](italic green)"
# not supported in zsh
# TODO: enable zsh support
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic bright-purple"
symbol = "⋈┈"
disabled = true


[directory]
home_symbol = "⌂"
truncation_length = 2
truncation_symbol = "…/"
read_only = " ◈"
use_os_path_sep = true
style = "italic blue"
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_style = 'bold blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

[cmd_duration]
format = "[ $duration ](italic white)"

[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "[▶](blue italic)"


[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed white"

# [battery]
# format = "[ $percentage $symbol]($style)"
# full_symbol = "󰁹"
# charging_symbol = "[↑](italic bold green)"
# discharging_symbol = "↓"
# unknown_symbol = "░"
# empty_symbol = "▃"
#
# [[battery.display]]
# threshold = 20
# style = "italic bold red"
#
# [[battery.display]]
# threshold = 60
# style = "italic dimmed bright-purple"
#
# [[battery.display]]
# threshold = 70
# style = "italic dimmed yellow"

[git_branch]
format = "[](#fab387) [$branch(:$remote_branch)]($style) "
symbol = "[](bold italic #fab387)"
style = "#fab387"
truncation_symbol = "⋯"
truncation_length = 11
# ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic bright-blue"
format = "([$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed]($style)[ ](bright-blue))"
conflicted = "[◪◦](italic bright-magenta)"
ahead = "[󱓊 ┤[${count}](bold green)│](italic green)"
behind = "[󱓋 ┤[${count}](bold red)│](italic red)"
diverged = "[◇ [${ahead_count}](regular white)│[${behind_count}](regular white)│](italic bright-magenta)"
untracked = "[◌◦](italic bright-yellow)"
stashed = "[󰩍 ](italic white)"
modified = "[●◦](italic yellow)"
staged = "[ ┤[$count](bold bright-cyan)│](italic bright-cyan)"
renamed = "[◎◦](italic bright-blue)"
deleted = "[](red)"

[deno]
format = "[∫ $version](green bold) "
version_format = "${raw}"

[lua]
format = "[${symbol}${version}]($style) "
version_format = "${raw}"
symbol = " "
style = "bold bright-blue"

[nodejs]
format = "[ ($version)](bold bright-green) "
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[python]
format = "[${symbol}${version}]($style) "
symbol = " "
version_format = "${raw}"
style = "bold bright-yellow"

[ruby]
format = "[${symbol}${version}]($style) "
symbol = "◆ "
version_format = "${raw}"
style = "bold red"

[rust]
format = "[$symbol$version]($style) "
symbol = " "
version_format = "${raw}"
style = "bold red"

[package]
format = "[$symbol$version]($style) "
version_format = "${raw}"
symbol = "◨ "
style = "dimmed yellow italic bold"

[swift]
format = "[${symbol}${version}]($style) "
symbol = " "
style = "bold bright-red"
version_format = "${raw}"

[aws]
disabled = true
format = "[aws](italic) [$symbol $profile $region]($style) "
style = "bold blue"
symbol = "▲ "

[buf]
symbol = "■ "
format = "[buf](italic) [$symbol $version $buf_version]($style) "

[c]
symbol = " "
format = "[$symbol($version(-$name))]($style) "
[cpp]
symbol = " "
format = "[$symbol($version(-$name))]($style) "

[conda]
symbol = " "
format = "[$symbol$environment]($style) "

[pixi]
symbol = "■ "
format = "pixi [$symbol$version ($environment )]($style) "

[dart]
symbol = "◁◅ "
format = "dart [$symbol($version )]($style) "

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "

[elixir]
symbol = "△ "
format = "exs [$symbol $version OTP $otp_version ]($style) "

[elm]
symbol = "◩ "
format = "elm [$symbol($version )]($style) "

[golang]
symbol = " "
format = "[$symbol($version )]($style) "

[haskell]
symbol = " "
format = "[$symbol($version )]($style) "

[java]
symbol = " "
format = "[${symbol}(${version} )]($style) "

[julia]
symbol = "◎ "
format = "jl [$symbol($version )]($style) "

[memory_usage]
symbol = "▪▫▪ "
format = "mem [${ram}( ${swap})]($style) "

[nim]
symbol = "▴▲▴ "
format = "nim [$symbol($version )]($style) "

[nix_shell]
style = 'bold italic dimmed blue'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed white)'
impure_msg = '[⌽](bold dimmed red)'
pure_msg = '[⌾](bold dimmed green)'
unknown_msg = '[◌](bold dimmed yellow)'

[spack]
symbol = "◇ "
format = "spack [$symbol$environment]($style) "

